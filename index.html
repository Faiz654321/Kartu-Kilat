<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartu Kilat · Beranda</title>
<meta name="theme-color" content="#35a0fb">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="screen" data-view="vHome">
    <div class="wave y" aria-hidden="true"></div>
    <div class="wave y2" aria-hidden="true"></div>
    <div class="wave b" aria-hidden="true"></div>
    <div class="bg-cards" aria-hidden="true">
      <img class="ghost g1" src="assets/cards/png/punggung.png" alt="" draggable="false">
      <img class="ghost g2" src="assets/cards/png/punggung.png" alt="" draggable="false">
      <img class="ghost g3" src="assets/cards/png/punggung.png" alt="" draggable="false">
      <img class="fc c1" src="assets/cards/png/merah-1.png" alt="" draggable="false">
      <img class="fc c2" src="assets/cards/png/kuning-balik.png" alt="" draggable="false">
      <img class="fc c3" src="assets/cards/png/biru-tambah2.png" alt="" draggable="false">
      <img class="fc c4" src="assets/cards/png/hijau-9.png" alt="" draggable="false">
    </div>

    <div class="view">
      <div class="home-row">
        <div class="home-left">
          <img class="logo-img" src="assets/logo/kartu-kilat-logo.svg" alt="Kartu Kilat" width="800" height="300">
          <a class="big-btn yel" id="goLogin" href="login.html"><svg viewBox="0 0 24 24" fill="#14264f" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.6 3.8-7.5 8.5-7.5s8.5 2.9 8.5 7.5z"/></svg><span>Login</span></a>
          <a class="big-btn out" id="goRegister" href="register.html"><svg viewBox="0 0 24 24" fill="#14264f" aria-hidden="true"><circle cx="10" cy="8" r="4.2"/><path d="M2.5 21c0-4.4 3.4-7 7.5-7s7.5 2.6 7.5 7z"/><path d="M19 6v6M16 9h6" stroke="#14264f" stroke-width="2.4" stroke-linecap="round"/></svg><span>Register</span></a>
          <p class="tag">Habiskan kartumu, jadi yang pertama!</p>
          <p class="desc">Gim kartu untuk dua pemain. Cocokkan warna atau angka kartu teratas, lalu habiskan kartumu lebih dulu. Main melawan komputer atau bergantian dengan teman.</p>
          <p class="msg" id="homeNote" role="status"></p>
        </div>
      </div>
    </div>

    <p class="store-warn" id="storeWarn" hidden>Penyimpanan peramban dinonaktifkan. Akun hanya bertahan selama halaman ini terbuka.</p>
  </div>
</div>
<script src="auth.js"></script>
<script src="ui.js"></script>
<script src="home.js"></script>
</body>
</html>
