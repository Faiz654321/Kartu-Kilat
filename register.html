<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register · Kartu Kilat</title>
<meta name="theme-color" content="#35a0fb">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div class="screen" data-view="vHome">
    <div class="wave y" aria-hidden="true"></div>
    <div class="wave y2" aria-hidden="true"></div>
    <div class="wave b" aria-hidden="true"></div>
    <div class="bg-cards" aria-hidden="true">
      <img class="ghost g1" src="assets/cards/png/punggung.png" alt="" draggable="false">
      <img class="ghost g2" src="assets/cards/png/punggung.png" alt="" draggable="false">
      <img class="ghost g3" src="assets/cards/png/punggung.png" alt="" draggable="false">
      <img class="fc c1" src="assets/cards/png/merah-1.png" alt="" draggable="false">
      <img class="fc c2" src="assets/cards/png/kuning-balik.png" alt="" draggable="false">
      <img class="fc c3" src="assets/cards/png/biru-tambah2.png" alt="" draggable="false">
      <img class="fc c4" src="assets/cards/png/hijau-9.png" alt="" draggable="false">
    </div>

    <div class="view">
      <div class="home-row reg-open">
        <div class="home-left">
          <img class="logo-img" src="assets/logo/kartu-kilat-logo.svg" alt="Kartu Kilat" width="800" height="300">
          <a class="big-btn yel" href="login.html"><svg viewBox="0 0 24 24" fill="#14264f" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.6 3.8-7.5 8.5-7.5s8.5 2.9 8.5 7.5z"/></svg><span>Login</span></a>
          <a class="big-btn out" href="index.html"><span>Kembali ke Beranda</span></a>
        </div>
        <section class="panel" id="regPanel" aria-labelledby="regTitle">
          <a class="x-btn" id="regClose" href="index.html" aria-label="Tutup, kembali ke Beranda">&times;</a>
          <h2 id="regTitle">Register</h2>
          <form id="regForm" novalidate>
            <label class="field"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.6 3.8-7.5 8.5-7.5s8.5 2.9 8.5 7.5z"/></svg><input id="regUser" type="text" placeholder="Username" aria-label="Username" autocomplete="username" maxlength="12" autocapitalize="none" spellcheck="false"></label>
            <label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3 7l9 6.5L21 7"/></svg><input id="regEmail" type="email" placeholder="Alamat email" aria-label="Alamat email" autocomplete="email" autocapitalize="none" spellcheck="false"></label>
            <label class="field"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="11" rx="2.5"/><path d="M7.5 10.5V8a4.5 4.5 0 0 1 9 0v2.5" fill="none" stroke="currentColor" stroke-width="2.6"/></svg><input id="regPass" type="password" placeholder="Password" aria-label="Password" autocomplete="new-password"><button class="eye" type="button" data-for="regPass" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button></label>
            <label class="field"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="11" rx="2.5"/><path d="M7.5 10.5V8a4.5 4.5 0 0 1 9 0v2.5" fill="none" stroke="currentColor" stroke-width="2.6"/></svg><input id="regPass2" type="password" placeholder="Konfirmasi password" aria-label="Konfirmasi password" autocomplete="new-password"><button class="eye" type="button" data-for="regPass2" aria-label="Tampilkan password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button></label>
            <p class="msg" id="regMsg" role="alert"></p>
            <button class="submit yel" id="regSubmit" type="submit">Register</button>
          </form>
          <p class="alt">Sudah punya akun? <a id="regToLogin" href="login.html">Login</a></p>
        </section>
      </div>
    </div>

    <p class="store-warn" id="storeWarn" hidden>Penyimpanan peramban dinonaktifkan. Akun hanya bertahan selama halaman ini terbuka.</p>
  </div>
</div>
<script src="auth.js"></script>
<script src="ui.js"></script>
<script src="register.js"></script>
</body>
</html>
